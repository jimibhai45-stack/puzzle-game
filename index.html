<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#35135f">
<title>Candy Blast Pro</title>
<style>
:root{--bg1:#211047;--bg2:#60249a;--panel:#ffffff18;--text:#fff;--gold:#ffd86b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#8e48c7 0,#492079 40%,#1a1038 100%);display:flex;justify-content:center;align-items:center;padding:14px;overscroll-behavior:none}
.app{width:min(100%,520px);margin:auto}
header{text-align:center;margin:2px 0 14px}
.logo{font-size:clamp(27px,7vw,43px);line-height:1;font-weight:1000;letter-spacing:1px;text-shadow:0 3px 0 #5d1a8c,0 7px 15px #0007;color:#fff}
.logo span{color:#ffe16c}
.subtitle{margin-top:7px;font-size:12px;letter-spacing:3px;font-weight:800;opacity:.8}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{border:1px solid #ffffff30;background:linear-gradient(180deg,#ffffff25,#ffffff0c);border-radius:15px;padding:9px 6px;text-align:center;box-shadow:0 5px 15px #0002}
.stat small{display:block;font-size:10px;font-weight:900;letter-spacing:1.3px;opacity:.8}
.stat strong{display:block;font-size:clamp(19px,5vw,25px);line-height:1.3;color:var(--gold)}
.progress-wrap{height:8px;background:#160d2c88;border-radius:20px;overflow:hidden;margin:-3px 2px 13px}
.progress{height:100%;width:0;background:linear-gradient(90deg,#64f7dc,#ffe16c);transition:width .25s}
.board-shell{position:relative;padding:9px;border-radius:21px;background:linear-gradient(135deg,#ffffff65,#ffffff10 35%,#160d2c99);border:1px solid #ffffff55;box-shadow:0 15px 35px #09051d70,inset 0 1px #fff6}
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;touch-action:pan-y;user-select:none}
.cell{aspect-ratio:1;min-width:0;border-radius:11px;background:#170b3270;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;border:1px solid #ffffff0c;transition:transform .12s,filter .12s;overflow:hidden}
.cell.selected{outline:3px solid #fff;outline-offset:-3px;transform:scale(.92);filter:brightness(1.2)}
.candy{width:83%;height:83%;border-radius:31% 31% 38% 38%;position:relative;box-shadow:inset 0 3px 3px #fff9,inset 0 -5px 6px #0003,0 3px 3px #0005;transform:rotate(-5deg);border:1px solid #ffffff60}
.candy:before{content:"";position:absolute;width:33%;height:16%;border-radius:100%;background:#ffffffb0;top:12%;left:17%;transform:rotate(-30deg);filter:blur(.4px)}
.candy:after{content:"";position:absolute;inset:10%;border:1px solid #ffffff30;border-radius:28%}
.c0{background:linear-gradient(145deg,#ff829f,#f31958 65%,#b80849)}
.c1{background:linear-gradient(145deg,#86edff,#19a9f4 65%,#1260c8)}
.c2{background:linear-gradient(145deg,#fff48a,#ffc526 65%,#e8870a)}
.c3{background:linear-gradient(145deg,#9bffae,#27d66b 65%,#079348)}
.c4{background:linear-gradient(145deg,#e4a5ff,#a14cf4 65%,#6821bd)}
.c5{background:linear-gradient(145deg,#ffbd80,#ff762b 65%,#c93b13)}
.special{border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #ffe56d,0 0 15px #fff8,inset 0 0 8px #fff8}
.special:after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:white;font-size:clamp(12px,3.5vw,21px);text-shadow:0 1px 4px #0008;border:0}
.controls{display:flex;gap:9px;margin-top:13px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 14px;font-weight:900;color:#321450;background:linear-gradient(#fff5a9,#ffc83e);box-shadow:0 4px 0 #bc791d,0 7px 15px #0003;flex:1;min-height:45px}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #bc791d}
button.secondary{color:#fff;background:linear-gradient(#ffffff32,#ffffff13);border:1px solid #ffffff40;box-shadow:0 4px 0 #160b2b}
.tip{text-align:center;font-size:12px;opacity:.8;margin:15px 8px 0}
.overlay{position:absolute;inset:9px;border-radius:15px;background:#21103beF;display:none;align-items:center;justify-content:center;text-align:center;padding:22px;z-index:3}
.overlay.show{display:flex}
.overlay h2{font-size:30px;margin:0 0 8px;color:var(--gold)}
.overlay p{margin:0 0 18px;line-height:1.5}
.overlay button{width:100%}
footer{text-align:center;font-size:10px;opacity:.5;margin-top:16px}
@media(max-width:380px){body{padding:9px}.board-shell{padding:6px}.board{gap:3px}.cell{border-radius:8px}.stats{gap:5px}.stat{padding:7px 4px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header><div class="logo">CANDY <span>BLAST</span></div><div class="subtitle">MATCH • BLAST • WIN</div></header>
<section class="stats" aria-label="Game statistics">
  <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
  <div class="stat"><small>TARGET</small><strong id="target">1000</strong></div>
  <div class="stat"><small>MOVES</small><strong id="moves">30</strong></div>
</section>
<div class="progress-wrap"><div class="progress" id="progress"></div></div>
<section class="board-shell" aria-label="Candy game board">
  <div class="board" id="board" role="grid" aria-label="8 by 8 candy board"></div>
  <div class="overlay show" id="overlay">
    <div><h2 id="overlayTitle">Ready to Blast?</h2><p id="overlayText">Match 3 or more candies of the same color.<br>Reach 1,000 points before your moves run out!</p><button id="overlayButton">PLAY NOW</button></div>
  </div>
</section>
<div class="controls"><button id="restart">↻ RESTART</button><button class="secondary" id="sound">♫ SOUND: OFF</button></div>
<p class="tip">Tap one candy, then tap a neighboring candy to swap.</p>
<footer> CANDY BLAST PRO • MADE FOR FUN</footer>
</main>
<script>
(() => {
'use strict';
const SIZE=8, COLORS=6, TARGET=1000, START_MOVES=30;
const boardEl=document.getElementById('board');
const scoreEl=document.getElementById('score'), movesEl=document.getElementById('moves');
const progressEl=document.getElementById('progress'), overlay=document.getElementById('overlay');
const overlayTitle=document.getElementById('overlayTitle'), overlayText=document.getElementById('overlayText'), overlayButton=document.getElementById('overlayButton');
let candies=[], score=0, moves=START_MOVES, selected=-1, busy=false, started=false, soundOn=false, audioCtx=null;
const rand=()=>Math.floor(Math.random()*COLORS);
function makeCandy(){return {color:rand(),special:false};}
function hasInitialMatch(r,c,color){
 return (c>=2&&candies[r*SIZE+c-1]?.color===color&&candies[r*SIZE+c-2]?.color===color)||
 (r>=2&&candies[(r-1)*SIZE+c]?.color===color&&candies[(r-2)*SIZE+c]?.color===color);
}
function initBoard(){
 candies=[];
 for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
  let candy=makeCandy(), tries=0;
  while(hasInitialMatch(r,c,candy.color)&&tries++<20)candy=makeCandy();
  candies.push(candy);
 }
 render(); updateStats();
}
function render(){
 boardEl.innerHTML='';
 candies.forEach((item,i)=>{
  const cell=document.createElement('button');
  cell.type='button';cell.className='cell'+(selected===i?' selected':'');
  cell.setAttribute('role','gridcell');cell.setAttribute('aria-label',`Candy ${i+1}, color ${item.color+1}`);
  cell.dataset.index=i;
  const candy=document.createElement('span');candy.className='candy c'+item.color+(item.special?' special':'');
  cell.appendChild(candy);cell.addEventListener('click',()=>onCell(i));
  boardEl.appendChild(cell);
 });
}
function updateStats(){
 scoreEl.textContent=score.toLocaleString();movesEl.textContent=moves;
 progressEl.style.width=Math.min(100,score/TARGET*100)+'%';
}
function neighbors(a,b){const ar=Math.floor(a/SIZE),ac=a%SIZE,br=Math.floor(b/SIZE),bc=b%SIZE;return Math.abs(ar-br)+Math.abs(ac-bc)===1;}
function onCell(i){
 if(!started||busy)return;
 if(selected===-1){selected=i;render();return;}
 if(selected===i){selected=-1;render();return;}
 if(neighbors(selected,i)){const a=selected;selected=-1;swap(a,i);}
 else{selected=i;render();}
}
function swap(a,b){busy=true;[candies[a],candies[b]]=[candies[b],candies[a]];render();setTimeout(()=>{
 const matches=findMatches();
 if(!matches.size){[candies[a],candies[b]]=[candies[b],candies[a]];render();busy=false;beep(180,.05);return;}
 moves--;resolveMatches(matches);
},140);}
function findMatches(){
 const found=new Set();
 for(let r=0;r<SIZE;r++){
  let start=0;
  while(start<SIZE){
   const color=candies[r*SIZE+start].color;let end=start+1;
   while(end<SIZE&&candies[r*SIZE+end].color===color)end++;
   if(end-start>=3)for(let c=start;c<end;c++)found.add(r*SIZE+c);
   start=end;
  }
 }
 for(let c=0;c<SIZE;c++){
  let start=0;
  while(start<SIZE){
   const color=candies[start*SIZE+c].color;let end=start+1;
   while(end<SIZE&&candies[end*SIZE+c].color===color)end++;
   if(end-start>=3)for(let r=start;r<end;r++)found.add(r*SIZE+c);
   start=end;
  }
 }
 return found;
}
function resolveMatches(matches){
 if(!matches.size){busy=false;updateStats();checkEnd();return;}
 const points=matches.size*60;
 score+=points;beep(420,.07);
 // Four or more matched candies create a special candy at one cleared position.
 const positions=[...matches];
 if(matches.size>=4){const keep=positions[Math.floor(positions.length/2)];candies[keep]={color:candies[keep].color,special:true};matches.delete(keep);}
 matches.forEach(i=>{candies[i]=null;});
 render();updateStats();
 setTimeout(()=>{
  for(let c=0;c<SIZE;c++){
   const stack=[];
   for(let r=SIZE-1;r>=0;r--){const item=candies[r*SIZE+c];if(item)stack.push(item);}
   for(let r=SIZE-1;r>=0;r--)candies[r*SIZE+c]=stack[SIZE-1-r]||makeCandy();
  }
  render();
  setTimeout(()=>{const next=findMatches();if(next.size)resolveMatches(next);else{busy=false;updateStats();checkEnd();}},130);
 },160);
}
function checkEnd(){
 if(score>=TARGET){started=false;showOverlay('Level Complete!','Amazing! You reached the target score.','PLAY AGAIN');}
 else if(moves<=0){started=false;showOverlay('Game Over','Your score: '+score.toLocaleString()+'. Try again and beat the target!','TRY AGAIN');}
}
function showOverlay(title,text,button){overlayTitle.textContent=title;overlayText.textContent=text;overlayButton.textContent=button;overlay.classList.add('show');}
function startGame(){score=0;moves=START_MOVES;selected=-1;busy=false;started=true;overlay.classList.remove('show');initBoard();}
function beep(freq,duration){
 if(!soundOn)return;
 try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.frequency.value=freq;osc.type='sine';gain.gain.value=.035;osc.connect(gain);gain.connect(audioCtx.destination);osc.start();gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);osc.stop(audioCtx.currentTime+duration);}catch(e){}
}
overlayButton.addEventListener('click',startGame);
document.getElementById('restart').addEventListener('click',()=>showOverlay('Start Again?','Your current round will restart. Ready for another sweet challenge?','RESTART GAME'));
document.getElementById('sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent='♫ SOUND: '+(soundOn?'ON':'OFF');if(soundOn)beep(660,.1);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&started){selected=-1;render();}});
initBoard();
})();
</script>
</body>
</html>
